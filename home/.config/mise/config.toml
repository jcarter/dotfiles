# Tools available in every directory. install.sh links this file to
# ~/.config/mise/config.toml; repository tasks and local settings stay in the
# repository's mise files.

[settings]
minimum_release_age = "7d"

[tool_alias]
fish = "aqua:fish-shell/fish-shell"
git = "conda:git"
markitdown = "pipx:markitdown"
oh-my-pi = "github:can1357/oh-my-pi"
ouch = "github:ouch-org/ouch"
pi-coding-agent = "npm:@earendil-works/pi-coding-agent"

[tools]
atuin = "latest"
bat = "latest"
delta = "latest"
elixir = "latest"
erlang = "latest"
eza = "latest"
fd = "latest"
fish = "latest"
fnox = "latest"
fzf = "latest"
gh = "latest"
git = "latest"
go = "latest"
herdr = "latest"
markitdown = { version = "0.1.7", extras = "all", uvx_args = "--python 3.13" }
node = "latest"
oh-my-pi = "latest"
ouch = "latest"
pi-coding-agent = "latest"
rust = "latest"
uv = "latest"
vivid = "latest"
worktrunk = "latest"
yazi = "latest"
zoxide = "latest"
