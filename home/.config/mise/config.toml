# Tools available in every directory. install.sh links this file to
# ~/.config/mise/config.toml; repository tasks and local settings stay in the
# repository's mise files.

[tools]
erlang = "latest"
elixir = "latest"
node = "latest"
rust = "latest"
go = "latest"
bat = "latest"
eza = "latest"
"cargo:fd-find" = "latest"
fzf = "latest"
gh = "latest"
herdr = "latest"
fnox = "latest"
worktrunk = "latest"
"github:can1357/oh-my-pi" = "latest"
"github:gokcehan/lf" = "latest"
"github:ouch-org/ouch" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
