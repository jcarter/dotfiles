# Tools and shared environment available in every directory. install.sh links
# this file to ~/.config/mise/config.toml; repository tasks stay in mise.toml.

[tools]
erlang = "latest"
elixir = "latest"
node = "latest"
rust = "latest"
go = "latest"
bat = "latest"
delta = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
herdr = "latest"
fnox = "latest"
"github:can1357/oh-my-pi" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"

[env]
PATH = "{{env.HOME}}/.local/bin:{{env.PATH}}"
