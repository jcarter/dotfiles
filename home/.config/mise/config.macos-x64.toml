# Intel-only fallback: Aqua's Delta, fd, and Atuin packages do not support this Mac.
# Atuin uses its GitHub release binary; Delta and fd still compile through Cargo.
# Remove this file and its bootstrap links when no Intel Macs use these dotfiles.
[tool_alias]
atuin = "github:atuinsh/atuin"
delta = "cargo:git-delta"
fd = "cargo:fd-find"
